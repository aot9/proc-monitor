[package]
name = "proc-monitor-ebpf"
version = "0.1.0"
edition = "2021"

[dependencies]
proc-monitor-common = { path = "../proc-monitor-common" }

aya-ebpf = { workspace = true }
aya-log-ebpf = { workspace = true }
aya-ebpf-bindings = { workspace = true }

[build-dependencies]
which = { workspace = true }

[[bin]]
name = "proc-monitor"
path = "src/main.rs"

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false