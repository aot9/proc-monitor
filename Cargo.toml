[workspace]
resolver = "2"
members = ["proc-monitor", "proc-monitor-common", "proc-monitor-ebpf"]
default-members = ["proc-monitor", "proc-monitor-common"]

[workspace.dependencies]
aya = { git = "https://github.com/aya-rs/aya.git", branch = "main" }
aya-build = { git = "https://github.com/aya-rs/aya.git", branch = "main" }
aya-ebpf = { git = "https://github.com/aya-rs/aya.git", branch = "main" }
aya-ebpf-bindings = { git = "https://github.com/aya-rs/aya.git", branch = "main" }
aya-log = { git = "https://github.com/aya-rs/aya.git", branch = "main" }
aya-log-ebpf = { git = "https://github.com/aya-rs/aya.git", branch = "main" }

anyhow = { version = "1", default-features = false }
# `std` feature is currently required to build `clap`.
#
# See https://github.com/clap-rs/clap/blob/61f5ee5/clap_builder/src/lib.rs#L15.
clap = { version = "4.5.20", default-features = false, features = ["std"] }
env_logger = { version = "0.11.5", default-features = false }
libc = { version = "0.2.159", default-features = false }
log = { version = "0.4.22", default-features = false }
tokio = { version = "1.40.0", default-features = false }
which = { version = "6.0.0", default-features = false }

[profile.release.package.proc-monitor-ebpf]
debug = 2
codegen-units = 1
